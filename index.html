<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Acropolist</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --friend: #e4572e; --general: #2e86de; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  #bar {
    position: absolute; z-index: 1000; top: 0; left: 0; right: 0;
    padding: calc(8px + env(safe-area-inset-top)) 8px 8px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    background: linear-gradient(rgba(255,255,255,.95), rgba(255,255,255,.75));
  }
  #bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid #ccc; background: #fff; color: #333;
    border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip.off { opacity: .45; }
  .chip.cat.on { background: #333; color: #fff; border-color: #333; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .sep { flex: none; width: 1px; background: #ccc; margin: 4px 2px; }
  .pin {
    width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }
  .popup h3 { margin: 0 0 4px; font-size: 16px; }
  .popup .meta { font-size: 12px; color: #666; margin-bottom: 6px; }
  .popup .by { font-weight: 600; color: var(--friend); }
  .popup p { margin: 0 0 8px; font-size: 14px; }
  .popup a.go {
    display: inline-block; background: #1a73e8; color: #fff; text-decoration: none;
    padding: 7px 12px; border-radius: 6px; font-size: 14px;
  }
  #locate {
    position: absolute; z-index: 1000; right: 12px; bottom: calc(28px + env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%; border: none; background: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="bar"></div>
<button id="locate" title="Where am I?" aria-label="Show my location">◎</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = { friend: '#e4572e', general: '#2e86de' };
const LABELS = { friend: 'Friends', general: 'General' };

const map = L.map('map', { zoomControl: false }).setView([37.9755, 23.7300], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = src => L.divIcon({
  className: '', iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -22],
  html: `<div class="pin" style="background:${COLORS[src]}"></div>`
});

const state = { sources: new Set(['friend', 'general']), category: null };
let markers = [];

function popupHtml(p) {
  const url = p.url || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', Athens');
  const by = p.source === 'friend'
    ? `<span class="by">${p.by ? 'Recommended by ' + esc(p.by) : "Friend's pick"}</span> · `
    : '';
  return `<div class="popup">
    <h3>${esc(p.name)}</h3>
    <div class="meta">${by}${esc(p.category)}${p.rating ? ` · ★ ${p.rating} (${p.reviews.toLocaleString()} Google reviews)` : ''}</div>
    ${p.note ? `<p>${esc(p.note)}</p>` : ''}
    <a class="go" href="${esc(url)}" target="_blank" rel="noopener">Open in Google Maps</a>
  </div>`;
}

function applyFilters() {
  for (const m of markers) {
    const show = state.sources.has(m.place.source) && (!state.category || m.place.category === state.category);
    if (show) m.addTo(map); else m.remove();
  }
}

function buildBar(places) {
  const bar = document.getElementById('bar');
  for (const src of ['friend', 'general']) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `<span class="dot" style="background:${COLORS[src]}"></span>${LABELS[src]}`;
    b.onclick = () => {
      state.sources.has(src) ? state.sources.delete(src) : state.sources.add(src);
      b.classList.toggle('off', !state.sources.has(src));
      applyFilters();
    };
    bar.appendChild(b);
  }
  bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
  const cats = [...new Set(places.map(p => p.category))].sort();
  const chips = [];
  for (const cat of cats) {
    const b = document.createElement('button');
    b.className = 'chip cat';
    b.textContent = cat;
    b.onclick = () => {
      state.category = state.category === cat ? null : cat;
      chips.forEach(c => c.classList.toggle('on', c.textContent === state.category));
      applyFilters();
    };
    chips.push(b);
    bar.appendChild(b);
  }
}

fetch('places.json').then(r => r.json()).then(places => {
  markers = places.map(p => {
    const m = L.marker([p.lat, p.lng], { icon: icon(p.source), zIndexOffset: p.source === 'friend' ? 1000 : 0 })
      .bindPopup(popupHtml(p));
    m.place = p;
    return m;
  });
  buildBar(places);
  applyFilters();
});

let me;
document.getElementById('locate').onclick = () => map.locate({ setView: true, maxZoom: 16 });
map.on('locationfound', e => {
  if (me) me.remove();
  me = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
});
map.on('locationerror', () => alert('Could not get your location.'));
</script>
</body>
</html>
