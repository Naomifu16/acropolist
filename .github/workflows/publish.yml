# The site is published from the gh-pages branch.
# This keeps gh-pages identical to main, so merging to main updates the live site.
name: Publish site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
